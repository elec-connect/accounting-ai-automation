version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: accounting-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    networks:
      - accounting-net

  workers:
    image: ghcr.io/your-org/accounting-workers:latest
    container_name: accounting-workers
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENV: production
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - accounting-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    image: ghcr.io/your-org/accounting-web:latest
    container_name: accounting-web
    env_file:
      - apps/web/.env.production
    ports:
      - "3000:3000"
    depends_on:
      - workers
    restart: always
    networks:
      - accounting-net

  nginx:
    image: nginx:1.27-alpine
    container_name: accounting-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web
      - workers
    restart: always
    networks:
      - accounting-net

volumes:
  redis_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  accounting-net:
    driver: bridge